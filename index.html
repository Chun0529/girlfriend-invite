<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9D7EA" />
    <title>要不要做我女朋友？</title>
    <meta name="description" content="一封藏起來的表白，只想問你一句話。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="petals" id="petals" aria-hidden="true"></div>
    <div class="bloom" aria-hidden="true"></div>

    <main class="stage">
      <article class="card" id="card">
        <div class="card-frame" aria-hidden="true">
          <svg class="corner corner-tl" viewBox="0 0 80 80" fill="none">
            <path d="M12 58c8-18 22-28 38-32" stroke="#E8A0C8" stroke-width="1.4" stroke-linecap="round" />
            <ellipse cx="22" cy="28" rx="10" ry="14" transform="rotate(-28 22 28)" fill="#F4B8D4" opacity=".9" />
            <ellipse cx="36" cy="22" rx="9" ry="13" transform="rotate(18 36 22)" fill="#C9B6F2" opacity=".85" />
            <circle cx="28" cy="26" r="5" fill="#F8E1A8" />
            <circle cx="58" cy="18" r="3.2" fill="#F4B8D4" />
          </svg>
          <svg class="corner corner-tr" viewBox="0 0 80 80" fill="none">
            <path d="M68 58c-8-18-22-28-38-32" stroke="#C9B6F2" stroke-width="1.4" stroke-linecap="round" />
            <ellipse cx="58" cy="26" rx="10" ry="14" transform="rotate(32 58 26)" fill="#E8A0C8" opacity=".9" />
            <ellipse cx="44" cy="20" rx="8" ry="12" transform="rotate(-16 44 20)" fill="#F7C9DE" />
            <circle cx="52" cy="24" r="5" fill="#F8E1A8" />
          </svg>
          <svg class="corner corner-bl" viewBox="0 0 80 80" fill="none">
            <ellipse cx="20" cy="58" rx="11" ry="15" transform="rotate(-40 20 58)" fill="#C9B6F2" opacity=".8" />
            <ellipse cx="34" cy="62" rx="8" ry="12" transform="rotate(24 34 62)" fill="#F4B8D4" />
            <circle cx="26" cy="60" r="4.5" fill="#F8E1A8" />
          </svg>
          <svg class="corner corner-br" viewBox="0 0 80 80" fill="none">
            <ellipse cx="60" cy="56" rx="11" ry="15" transform="rotate(38 60 56)" fill="#F4B8D4" opacity=".85" />
            <ellipse cx="46" cy="62" rx="8" ry="12" transform="rotate(-20 46 62)" fill="#D7C4F5" />
            <circle cx="54" cy="58" r="4.5" fill="#F8E1A8" />
          </svg>
        </div>

        <ol class="progress" id="progress" aria-label="表白進度">
          <li class="is-active"><span>邀請</span></li>
          <li><span>日期</span></li>
          <li><span>情書</span></li>
        </ol>

        <section class="step is-active" data-step="1" id="step-ask">
          <p class="kicker">鼓起勇氣問你</p>
          <h1 class="title">
            <span aria-hidden="true">🌸</span>
            要不要做我女朋友？
            <span aria-hidden="true">🌸</span>
          </h1>
          <p class="lead">沒有很華麗的台詞，只有這一句，想聽你親口說好。</p>
          <div class="actions" id="ask-actions">
            <button type="button" class="btn btn-yes" id="btn-yes">好哦 ♥</button>
            <button type="button" class="btn btn-no" id="btn-no" aria-label="這個按鈕會逃跑">No 👋</button>
          </div>
        </section>

        <section class="step" data-step="2" id="step-date" hidden>
          <p class="kicker">把日子圈起來</p>
          <h2 class="title">哪一天比較好？</h2>
          <p class="lead">我把下一個週末先留給你，當然也可以換。</p>
          <div class="calendar" id="calendar"></div>
          <button type="button" class="btn btn-yes btn-block" id="btn-date" disabled>就這天！❤</button>
        </section>

        <section class="step" data-step="3" id="step-letter" hidden>
          <p class="kicker">藏起來的情書</p>
          <h2 class="title">給你的信</h2>
          <article class="letter" id="letter"></article>
          <div class="letter-actions">
            <a class="btn btn-whatsapp btn-block" id="btn-whatsapp" target="_blank" rel="noopener noreferrer">用 WhatsApp 回我</a>
            <button type="button" class="btn btn-ghost btn-block" id="btn-replay">再看一次</button>
          </div>
        </section>
      </article>
    </main>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
