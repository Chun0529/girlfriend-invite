<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9D7EA" />
    <title>要不要做我女朋友？</title>
    <meta name="description" content="一封藏起來的表白，只想問你一句話。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="bloom" aria-hidden="true"></div>

    <main class="stage">
      <article class="card" id="card">
        <ol class="progress" id="progress" aria-label="表白進度">
          <li class="is-active"><span>邀請</span></li>
          <li><span>日期</span></li>
          <li><span>情書</span></li>
        </ol>

        <section class="step is-active" data-step="1" id="step-ask">
          <p class="kicker">鼓起勇氣問你</p>
          <h1 class="title">
            <span aria-hidden="true">🌸</span>
            要不要做我女朋友？
            <span aria-hidden="true">🌸</span>
          </h1>
          <p class="lead">沒有很華麗的台詞，只有這一句，想聽你親口說好。</p>
          <div class="actions" id="ask-actions">
            <button type="button" class="btn btn-yes" id="btn-yes">好哦 ♥</button>
            <button type="button" class="btn btn-no" id="btn-no" aria-label="這個按鈕會逃跑">No 👋</button>
          </div>
        </section>

        <section class="step" data-step="2" id="step-date" hidden>
          <p class="kicker">把日子圈起來</p>
          <h2 class="title">哪一天比較好？</h2>
          <p class="lead">我把下一個週末先留給你，當然也可以換。</p>
          <div class="calendar" id="calendar"></div>
          <button type="button" class="btn btn-yes btn-block" id="btn-date" disabled>就這天！❤</button>
        </section>

        <section class="step" data-step="3" id="step-letter" hidden>
          <p class="kicker">藏起來的情書</p>
          <h2 class="title">給你的信</h2>
          <article class="letter" id="letter"></article>
          <div class="letter-actions">
            <a class="btn btn-whatsapp btn-block" id="btn-whatsapp" target="_blank" rel="noopener noreferrer">用 WhatsApp 回我</a>
            <button type="button" class="btn btn-ghost btn-block" id="btn-replay">再看一次</button>
          </div>
        </section>
      </article>
    </main>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
